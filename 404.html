<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Ralphie Studios</title>
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }
    #cvs { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .hero-glow {
      position: absolute; inset: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 55% 55% at 33% 62%, rgba(253,142,55,0.09) 0%, transparent 70%),
        radial-gradient(ellipse 55% 55% at 67% 38%, rgba(106,163,232,0.11) 0%, transparent 70%);
    }
    .error-content { position: relative; z-index: 2; max-width: 560px; }
    .error-code {
      font-family: 'Russo One', sans-serif;
      font-size: clamp(6rem, 20vw, 12rem);
      line-height: 1;
      background: linear-gradient(135deg, var(--blue) 0%, var(--orange) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.25rem;
    }
    .error-title {
      font-family: 'Russo One', sans-serif;
      font-size: clamp(1.4rem, 4vw, 2rem);
      margin-bottom: 1rem;
    }
    .error-desc {
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 2.5rem;
      max-width: 36ch;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>

  <nav id="nav" class="scrolled">
    <a href="/" class="nav-brand"><span class="nr">RALPHIE</span><span class="ns">STUDIOS</span></a>
    <ul class="nav-links">
      <li><a href="index.html#about">About</a></li>
      <li><a href="index.html#games">Games</a></li>
      <li><a href="index.html#team">Team</a></li>
      <li><a href="index.html#connect">Connect</a></li>
    </ul>
  </nav>

  <div class="error-page">
    <canvas id="cvs"></canvas>
    <div class="hero-glow"></div>
    <div class="error-content">
      <div class="error-code">404</div>
      <h1 class="error-title">Level Not Found</h1>
      <p class="error-desc">This page respawned somewhere else — or never existed in the first place. Ralph has been notified.</p>
      <a href="index.html" class="btn btn-p">Back to Home</a>
    </div>
  </div>

  <script>
    const cvs = document.getElementById('cvs');
    const cx = cvs.getContext('2d');
    let W, H, pts;
    function init() {
      W = cvs.width  = cvs.offsetWidth;
      H = cvs.height = cvs.offsetHeight;
      pts = Array.from({ length: 120 }, () => ({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() * 1.5 + 0.3,
        vx: (Math.random() - 0.5) * 0.2,
        vy: (Math.random() - 0.5) * 0.2,
        col: Math.random() > 0.5 ? 0 : 1,
        a: Math.random() * 0.45 + 0.08
      }));
    }
    function tick() {
      cx.clearRect(0, 0, W, H);
      for (const p of pts) {
        p.x = (p.x + p.vx + W) % W;
        p.y = (p.y + p.vy + H) % H;
        cx.beginPath();
        cx.arc(p.x, p.y, p.r, 0, 6.283);
        cx.fillStyle = p.col ? `rgba(253,142,55,${p.a})` : `rgba(106,163,232,${p.a})`;
        cx.fill();
      }
      requestAnimationFrame(tick);
    }
    addEventListener('resize', init, { passive: true });
    init(); tick();
  </script>
</body>
</html>
